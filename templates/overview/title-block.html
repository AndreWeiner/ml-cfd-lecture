<header id="title-block-header" class="quarto-title-block default">
<div class="quarto-title">
<img class="overview-university-logo dark-content" src="images/TUD-white.svg" alt="TU Dresden — Dresden University of Technology">
<img class="overview-university-logo light-content" src="images/TUD_Logo_RGB_horizontal_schwarz_en.svg" alt="TU Dresden — Dresden University of Technology">
$if(title)$
<h1 class="title">$title$</h1>
$endif$
$if(subtitle)$
<p class="subtitle lead">$subtitle$</p>
$endif$
$if(categories)$
  $if(quarto-template-params.title-block-categories)$
<div class="quarto-categories">
  $for(categories)$
  <div class="quarto-category">$categories$</div>
  $endfor$
</div>
  $endif$
$endif$
</div>

$if(hide-description)$
$elseif(description)$
<div>
  <div class="description">
    $description$
  </div>
</div>
$endif$

$title-metadata.html()$

</header>
