website:
  title: Machine Learning in Fluid Mechanics
  navbar:
    logo:
      light:
        path: images/TUD_Logo_RGB_horizontal_schwarz_en.svg
        alt: TU Dresden — Dresden University of Technology
      dark:
        path: images/TUD-white.svg
        alt: TU Dresden — Dresden University of Technology
    left:
    - href: index.qmd
      text: Course overview
  sidebar:
    style: docked
    search: true
    contents:
    - href: index.qmd
      text: Overview
    - section: Lectures and exercises
      contents:
      - notebooks/lecture_00.qmd
      - section: Course overview and motivation
        contents:
        - href: notebooks/ml_cfd_intro.py
          text: Lecture
        - href: notebooks/system_setup.py
          text: Practice
      - section: Introduction to machine learning
        contents:
        - href: notebooks/ml_intro.py
          text: Lecture
        - href: notebooks/ml_intro_exercise.py
          text: Practice

      - section: Surrogate models for discrete predictions
        contents:
        - href: notebooks/bubble_path_classification.py
          text: Lecture
        - href: notebooks/bubble_path_classification_exercise.py
          text: Practice

    - section: Optional material
      contents:
      - href: notebooks/python_intro.py
        text: Getting started with Python
      - href: notebooks/neural_network_training.py
        text: Training neural networks

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss]
      light: cosmo
    respect-user-color-scheme: false
    toc: true
    code-copy: true
    code-overflow: scroll
    css: quarto.css
execute:
  freeze: true
  warning: false
  error: false
  daemon: false
lang: en
